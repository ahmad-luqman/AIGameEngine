name: Fuzz (nightly)

# Longer fuzzing than the per-push CI job, one job per target so the wall-clock time does not grow with the number of
# targets (at 20 minutes per target, the old single job outlasted its 150-minute timeout). One job builds every target and
# the per-target jobs download them, so they need no compiler, dependency sources or compiler cache. They run on the same
# image, and the targets link everything but the C and C++ runtimes statically (the Vulkan loader and GLFW's window
# system libraries are opened at run time, which the targets never reach). The matrix and the tarball take their targets
# from scripts/fuzz.sh --list; the build builds the same ones (fuzz.sh without a filter). Each target's grown corpus is
# cached between nights. After changing this workflow, .github/actions/setup-breccia or the FUZZ_MODE paths of
# scripts/fuzz.sh, start it by hand on the branch (gh workflow run fuzz-nightly.yml --ref <branch> -f seconds=60):
# nothing else runs it before the next night.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per fuzz target (at most 2400, so a run fits the Fuzz step's 60-minute timeout)
        required: true
        default: "1200"

env:
  SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || '1200' }}

# Explicit bash adds pipefail (the default shell runs bash -e only).
defaults:
  run:
    shell: bash

jobs:
  # The build compiles through ccache, restoring (never saving) the CI fuzz job's cache. Its dependency sources come from
  # CI's dependency-source cache like any CI job's (main's entry for the scheduled run, or the branch's own; a pull
  # request's entries are not visible to it; fetched and saved on a miss).
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_COMPILERCHECK: content
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@v4

      # The only check of the input before the fuzz jobs use it, so a bad manual value fails once, before the build.
      - name: Check the input
        run: |
          if [[ ! "$SECONDS_PER_TARGET" =~ ^[1-9][0-9]{0,3}$ ]] || [[ "$SECONDS_PER_TARGET" -gt 2400 ]]; then
            echo "::error::seconds must be a whole number from 1 to 2400, to fit the Fuzz step's timeout"
            exit 1
          fi

      # An assignment, so a failing --list fails the step (a command substitution inside echo's arguments would not).
      - name: List fuzz targets
        id: list
        run: |
          targets="$(scripts/fuzz.sh --list)"
          jq -e 'type == "array" and length > 0' <<< "$targets" > /dev/null
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

      - name: Set up the build tools
        timeout-minutes: 30
        uses: ./.github/actions/setup-breccia
        with:
          apt-packages: clang

      # One build per night: saving would store a near-identical copy of the CI fuzz job's cache.
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: fuzz
          max-size: 800M
          evict-old-files: 7d
          save: false

      - name: Build
        run: FUZZ_MODE=build scripts/fuzz.sh

      - name: Check that the build uses the caches
        run: scripts/ci-check-caches.sh build-fuzz

      # Artifacts lose file modes, so the executables travel in a tarball. Debug builds with ASan, UBSan and libFuzzer's
      # coverage instrumentation are large (about 600 MB packed); the artifact stores the zstd tarball as it is. The list
      # step checked the list, and tar fails on a missing file or an empty list.
      - name: Pack the targets
        env:
          TARGETS: ${{ steps.list.outputs.targets }}
        run: |
          mapfile -t targets < <(jq -r '.[]' <<< "$TARGETS")
          tar -C build-fuzz/bin -I 'zstd -T0 -3' -cf "$RUNNER_TEMP/fuzz-targets.tar.zst" "${targets[@]}"
          ls -l "$RUNNER_TEMP/fuzz-targets.tar.zst"

      # Kept three days: long enough to re-run failed fuzz jobs the next day, short enough not to hoard 600 MB artifacts.
      # A re-run of every job uploads it again.
      - uses: actions/upload-artifact@v4
        with:
          name: fuzz-targets
          path: ${{ runner.temp }}/fuzz-targets.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
          overwrite: true

  fuzz:
    needs: build
    name: fuzz / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.build.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fuzz-targets
          path: ${{ runner.temp }}

      - name: Unpack the targets
        run: |
          mkdir -p build-fuzz/bin
          tar -C build-fuzz/bin -I zstd -xf "$RUNNER_TEMP/fuzz-targets.tar.zst"

      # Sanitizer reports show source locations only through an llvm-symbolizer that can read the target, and find one by
      # their own rules (Ubuntu's runtime looks for its own version's name); without one a report is raw addresses and
      # nothing fails. This step resolves the target's entry point to a source line, so a symbolizer that cannot read it
      # fails here, and names it explicitly. The image ships LLVM under version-suffixed names only (the newest is
      # taken); otherwise apt installs it.
      - name: Find llvm-symbolizer
        env:
          TARGET: ${{ matrix.target }}
        run: |
          shopt -s nullglob
          symbolizer="$(command -v llvm-symbolizer || true)"
          versioned=(/usr/bin/llvm-symbolizer-*)
          if [[ -z "$symbolizer" && ${#versioned[@]} -gt 0 ]]; then
            symbolizer="$(printf '%s\n' "${versioned[@]}" | sort -V | tail -n 1)"
          fi
          if [[ -z "$symbolizer" ]]; then
            scripts/ci-apt-install.sh llvm
            symbolizer="$(command -v llvm-symbolizer)" || { echo "::error::installing llvm put no llvm-symbolizer on PATH"; exit 1; }
          fi
          "$symbolizer" --version | sed -n '1,2p'
          # awk reads all of nm's output (an early exit would fail the pipeline with SIGPIPE).
          read -r count address < <(nm "build-fuzz/bin/$TARGET" | awk '$3 == "LLVMFuzzerTestOneInput" { n++; a = $1 } END { print n + 0, a }')
          if [[ "$count" -ne 1 ]]; then
            echo "::error::nm found $count definitions of LLVMFuzzerTestOneInput in build-fuzz/bin/$TARGET (expected 1)"
            exit 1
          fi
          location="$("$symbolizer" --obj="build-fuzz/bin/$TARGET" "0x$address")"
          echo "$location"
          if [[ "$location" != *"Tests/Fuzz/$TARGET.cpp:"[1-9]* ]]; then
            echo "::error::$symbolizer cannot resolve $TARGET's entry point to its source"
            exit 1
          fi
          {
            echo "ASAN_SYMBOLIZER_PATH=$symbolizer"
            echo "UBSAN_SYMBOLIZER_PATH=$symbolizer"
          } >> "$GITHUB_ENV"

      # Restored and saved separately so the corpus grown before a crash or a Fuzz step timeout is kept too
      # (actions/cache's own save is a post step that runs only when every earlier step succeeded).
      - name: Restore corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build-fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # A step timeout fails the step instead of cancelling the job, so the corpus and crash steps below still run.
      - name: Fuzz
        timeout-minutes: 60
        env:
          TARGET: ${{ matrix.target }}
        run: FUZZ_MODE=run scripts/fuzz.sh "$SECONDS_PER_TARGET" "$TARGET"

      # Only after a restore: an earlier failure leaves no corpus to save.
      - name: Save corpus
        if: always() && steps.corpus.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: build-fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Crash inputs and the full fuzzer log (a target can fail without writing a crash input). A re-run attempt gets an
      # artifact of its own, keeping the earlier attempt's inputs.
      - name: Upload crash inputs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}${{ github.run_attempt > 1 && format('-{0}', github.run_attempt) || '' }}
          path: |
            build-fuzz/crashes
            build-fuzz/logs
          if-no-files-found: ignore
