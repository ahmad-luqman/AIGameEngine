name: Fuzz (nightly)

# Longer fuzzing than the per-push CI job; the grown corpus is cached between nights so each run starts
# from everything found before.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per fuzz target
        default: "1200"

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "20"; Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts
          sudo apt-get update
          sudo apt-get install -y ninja-build glslc libvulkan1 clang \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build-fuzz/_deps
          key: deps-fuzz-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Restore corpus
        uses: actions/cache@v4
        with:
          path: build-fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Fuzz
        run: scripts/fuzz.sh "${{ github.event.inputs.seconds || '1200' }}"

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: build-fuzz/crashes
