name: Fuzz (nightly)

# Longer fuzzing than the per-push CI job, one job per target so the wall-clock time does not grow with the number
# of targets (twelve targets at 20 minutes each outlasted the old single job's 150-minute timeout). Each target's
# grown corpus is cached between nights so each run starts from everything found before.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per fuzz target (at most 2400; the Fuzz step's 80-minute timeout also covers the build)
        default: "1200"

# The fuzz build compiles through ccache, restoring (never saving) the CI fuzz job's cache, and takes the dependency
# sources from main's entry of CI's dependency-source cache (scripts/ci-fetch-deps.sh, cmake/DependencySources.cmake).
# Without libdbus-1-dev a fetch would leave out nativefiledialog, so the jobs only restore that cache; on a miss their
# configure downloads as usual.
env:
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_COMPILERCHECK: content
  BASALT_DEPS_SOURCE_DIR: ${{ github.workspace }}/_deps

jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@v4

      - name: List fuzz targets
        id: list
        run: |
          targets="$(scripts/fuzz.sh --list)"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: targets
    name: fuzz / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          scripts/ci-apt-install.sh ninja-build glslc libvulkan1 clang libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Restore dependency sources
        uses: actions/cache/restore@v4
        with:
          path: _deps
          key: deps-src-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'scripts/ci-fetch-deps.sh') }}

      # One target per job: saving from every job would store a near-identical copy of the CI fuzz cache per target.
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: fuzz
          max-size: 800M
          evict-old-files: 7d
          save: false

      # Restored and saved separately so the corpus grown before a crash or a Fuzz step timeout is kept too
      # (actions/cache's own save is a post step that runs only when every earlier step succeeded).
      - name: Restore corpus
        uses: actions/cache/restore@v4
        with:
          path: build-fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # A step timeout fails the step instead of cancelling the job, so the corpus and crash steps below still run.
      - name: Fuzz
        timeout-minutes: 80
        env:
          SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || '1200' }}
          TARGET: ${{ matrix.target }}
        run: |
          if [[ ! "$SECONDS_PER_TARGET" =~ ^[0-9]{1,4}$ ]] || [[ "$SECONDS_PER_TARGET" -gt 2400 ]]; then
            echo "seconds must be a whole number of at most 2400 to fit the step timeout" >&2
            exit 1
          fi
          scripts/fuzz.sh "$SECONDS_PER_TARGET" "$TARGET"

      - name: Save corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build-fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Crash inputs and the full fuzzer log (a target can fail without writing a crash input).
      - name: Upload crash inputs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: |
            build-fuzz/crashes
            build-fuzz/logs
          if-no-files-found: ignore
