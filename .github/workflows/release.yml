name: Release

# A v<version> tag builds Dist on every platform (universal, arm64 + x86_64, on macOS), packages the tools and the
# samples (scripts/package_release.py), signs them (macOS ad hoc, or with a Developer ID and notarized when its secrets
# are set; Windows when its certificate secret is set; Docs/Shipping.md) and publishes them as a GitHub release. Pull
# requests that change the main inputs of the packages (the workflow, the shared setup action and the CI scripts it and
# this workflow run, the packaging and signing scripts, the top-level and engine CMakeLists.txt (the macOS deployment
# target), cmake/Dependencies.cmake (the Vulkan-Headers tag the release's loader is built at), the Project module, the
# runtime, the Process, Window, VulkanLoader, PackArchive and CrashReporter sources, the samples), and manual runs, do
# everything except publishing (same-repository ones signing with the real secrets), so the pipeline, signing included,
# is tested before a tag needs it.
on:
  push:
    tags: [ 'v*' ]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/actions/setup-breccia/**
      - scripts/ci-*.sh
      - scripts/package_release.py
      - scripts/sign-macos.sh
      - scripts/sign-windows.py
      - CMakeLists.txt
      - Breccia/CMakeLists.txt
      - cmake/Dependencies.cmake
      - Breccia/Source/Breccia/Project/**
      - Breccia/Source/Breccia/Core/Process.*
      - Breccia/Source/Breccia/Core/Window.*
      - Breccia/Source/Breccia/Core/PackArchive.*
      - Breccia/Source/Breccia/Core/CrashReporter.*
      - Breccia/Source/Breccia/Renderer/VulkanLoader.*
      - Breccia-Runtime/**
      - Samples/**
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.os }} / package
    runs-on: ${{ matrix.os }}
    # The universal macOS build compiles everything twice, and with a Developer ID each of up to eight notarizations may
    # wait 30 minutes for Apple (scripts/sign-macos.sh).
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-latest, macos-15 ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: python scripts/package_release.py --check-tag "$GITHUB_REF_NAME"

      # Build tools and dependency sources. The Vulkan loader and MoltenVK that macOS packages bundle are built universal
      # after the build (Homebrew's hold one architecture).
      - name: Set up the build tools
        timeout-minutes: 30
        uses: ./.github/actions/setup-breccia

      # Pinned and checksummed. The type2 runtime is passed explicitly; appimagetool would otherwise download the
      # latest one while it builds each AppImage.
      # Through the API with the job's token (gh release download): anonymous release downloads are the first GitHub
      # throttles, and answered 504 for whole runs.
      - name: Install appimagetool (Linux)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools="$RUNNER_TEMP/appimage"
          mkdir -p "$tools"
          download() {
            for attempt in 1 2 3 4 5; do
              gh release download "$2" --repo "$1" --pattern "$3" --output "$4" --clobber && return 0
              echo "downloading $3 from $1 failed (attempt $attempt), trying again in 10 s"
              sleep 10
            done
            echo "::error::cannot download $3 from $1 $2"
            return 1
          }
          download AppImage/appimagetool 1.9.1 appimagetool-x86_64.AppImage "$tools/appimagetool"
          download AppImage/type2-runtime 20251108 runtime-x86_64 "$tools/runtime"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $tools/appimagetool" | sha256sum -c -
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $tools/runtime" | sha256sum -c -
          chmod +x "$tools/appimagetool"
          printf '#!/bin/sh\nexec "%s/appimagetool" --runtime-file "%s/runtime" "$@"\n' "$tools" "$tools" > "$tools/appimagetool-pinned"
          chmod +x "$tools/appimagetool-pinned"
          echo "APPIMAGETOOL=$tools/appimagetool-pinned" >> "$GITHUB_ENV"

      # Dist: optimized, no asserts. The tests run in CI on every push; here the samples' smoke tests check the build. macOS
      # builds both architectures into each binary (package_release.py --require-universal checks).
      # The default shell (pwsh on Windows), not bash: Git Bash's PATH puts its own link before MSVC's link.exe.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Dist -DBRECCIA_BUILD_TESTS=OFF -DBRECCIA_CHECK_FORMAT=OFF ${{ runner.os == 'macOS' && '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"' || '' }}

      - name: Check that the build uses the caches
        shell: bash
        run: scripts/ci-check-caches.sh build

      - name: Build
        run: cmake --build build -- -k 0

      # After the build, so the build's glslc lookup (cmake/Shaders.cmake hints at $VULKAN_SDK/bin) never sees a VULKAN_SDK that
      # holds only lib/. package_release.py and the exporter take the libraries from it.
      - name: Build universal Vulkan libraries (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        shell: bash
        run: |
          scripts/ci-universal-vulkan.sh "$RUNNER_TEMP/vulkan"
          echo "VULKAN_SDK=$RUNNER_TEMP/vulkan" >> "$GITHUB_ENV"

      # With a Developer ID in the repository secrets, the macOS tools and samples are signed and notarized; otherwise they
      # are signed ad hoc (and a tag release says so). MACOS_CERTIFICATE is a base64 .p12 of the "Developer ID
      # Application" certificate; the other five secrets (Docs/Shipping.md) must be set with it.
      - name: Import the signing certificate (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::warning::No MACOS_CERTIFICATE secret: the macOS tools and samples are signed ad hoc, and Gatekeeper blocks them on other Macs."
            else
              echo "No MACOS_CERTIFICATE secret: the tools and samples are signed ad hoc."
            fi
            exit 0
          fi
          for secret in MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::MACOS_CERTIFICATE is set but the $secret secret is not (Docs/Shipping.md lists all six)."
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          xcrun notarytool store-credentials breccia-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
          echo "SIGN_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      # With a code signing certificate in the repository secrets, the Windows tools and samples are signed with signtool
      # (scripts/sign-windows.py) and timestamped; otherwise they are not signed (and a tag release says so).
      # WINDOWS_CERTIFICATE is a base64 .pfx with its private key, WINDOWS_CERTIFICATE_PASSWORD its (required) password. It
      # goes into the runner's certificate store, from which signtool takes it by thumbprint, so the password reaches no
      # command line. Publicly trusted certificates issued since June 2023 cannot leave their hardware as a .pfx: for one,
      # replace this step with the signing service's own, which sets WINDOWS_SIGNING_DLIB and WINDOWS_SIGNING_METADATA (and
      # WINDOWS_SIGNING_TIMESTAMP_URL) in GITHUB_ENV for the Package step (Docs/Shipping.md).
      - name: Import the signing certificate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            if ($env:GITHUB_REF -like 'refs/tags/*') {
              Write-Output "::warning::No WINDOWS_CERTIFICATE secret: the Windows tools and samples are not signed, and SmartScreen warns about them."
            } else {
              Write-Output "No WINDOWS_CERTIFICATE secret: the tools and samples are not signed."
            }
            exit 0
          }
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            Write-Output "::error::WINDOWS_CERTIFICATE is set but the WINDOWS_CERTIFICATE_PASSWORD secret is not (Docs/Shipping.md)."
            exit 1
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          try {
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $imported = @(Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password)
          } finally {
            Remove-Item $pfx
          }
          # A .pfx may carry its issuers, or an expired certificate beside a renewed one: take the one code signing
          # certificate with a private key that is valid now. Usages are read from the certificate's own extension.
          $now = Get-Date
          $usages = { param($c) @($c.Extensions | Where-Object { $_ -is [Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension] } |
            ForEach-Object { $_.EnhancedKeyUsages } | ForEach-Object { $_.Value }) }
          $certificate = @($imported | Where-Object {
            $_.HasPrivateKey -and $_.NotBefore -le $now -and $now -lt $_.NotAfter -and ((& $usages $_) -contains '1.3.6.1.5.5.7.3.3')
          })
          if ($certificate.Count -ne 1) {
            $found = ($imported | ForEach-Object { "$($_.Subject) (private key: $($_.HasPrivateKey); valid $($_.NotBefore) to $($_.NotAfter); usages: $((& $usages $_) -join ', '))" }) -join '; '
            Write-Output "::error::WINDOWS_CERTIFICATE must hold exactly one certificate that has its private key, is valid now and allows code signing (1.3.6.1.5.5.7.3.3); $($certificate.Count) of these do: $found"
            exit 1
          }
          $certificate = $certificate[0]
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package
        shell: bash
        run: |
          arguments=(--build build --output dist)
          [[ "$RUNNER_OS" == "Linux" ]] && arguments+=(--require-appimage)
          [[ "$RUNNER_OS" == "macOS" ]] && arguments+=(--require-universal)
          [[ -n "${SIGN_IDENTITY:-}" ]] && arguments+=(--sign-identity "$SIGN_IDENTITY" --notarize breccia-notary)
          [[ -n "${WINDOWS_CERTIFICATE_THUMBPRINT:-}" ]] && arguments+=(--windows-certificate "$WINDOWS_CERTIFICATE_THUMBPRINT")
          # A signing service's library and metadata, which a replacement for the import step sets (Docs/Shipping.md).
          [[ -n "${WINDOWS_SIGNING_DLIB:-}" ]] && arguments+=(--windows-dlib "$WINDOWS_SIGNING_DLIB" --windows-dlib-metadata "${WINDOWS_SIGNING_METADATA:-}")
          [[ -n "${WINDOWS_SIGNING_TIMESTAMP_URL:-}" ]] && arguments+=(--windows-timestamp-url "$WINDOWS_SIGNING_TIMESTAMP_URL")
          python scripts/package_release.py "${arguments[@]}"
          # The publish job adds these notes to the release.
          if [[ "$RUNNER_OS" == "macOS" && -z "${SIGN_IDENTITY:-}" ]]; then
            echo "The macOS tools and samples are signed ad hoc, not with a Developer ID: macOS blocks them until you allow them in System Settings > Privacy & Security." > dist/NOTES-macos.md
          fi
          if [[ "$RUNNER_OS" == "Windows" && -z "${WINDOWS_CERTIFICATE_THUMBPRINT:-}${WINDOWS_SIGNING_DLIB:-}" ]]; then
            echo "The Windows tools and samples are not signed: SmartScreen warns before they first run (More info > Run anyway)." > dist/NOTES-windows.md
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/SHA256SUMS-*.txt > dist/SHA256SUMS.txt
          rm dist/SHA256SUMS-*.txt
          # Platform notes (unsigned or ad hoc signed packages) come before the generated notes.
          cat dist/NOTES-*.md > "$RUNNER_TEMP/notes.md" 2>/dev/null || true
          rm -f dist/NOTES-*.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Breccia ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes --verify-tag
