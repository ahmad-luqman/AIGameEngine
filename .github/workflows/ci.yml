name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# A newer push to the same branch makes older runs pointless: cancel them instead of queueing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-latest, macos-15 ]
        config: [ Debug, Release ]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslc libvulkan1 \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja shaderc clang-format

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true
          stripdown: true

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-plain-${{ runner.os }}-${{ matrix.config }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        shell: bash
        run: |
          formatCheck=OFF
          if [[ "${{ runner.os }}" == "macOS" && "${{ matrix.config }}" == "Debug" ]]; then formatCheck=ON; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DBASALT_CHECK_FORMAT=$formatCheck

      - name: Build
        run: cmake --build build -- -k 0

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # AddressSanitizer + UndefinedBehaviorSanitizer over every headless test. All code, third-party
  # included, is instrumented (cmake/Sanitizers.cmake).
  sanitizers:
    name: ubuntu-24.04 / ASan+UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslc libvulkan1 clang \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-asan-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            "-DBASALT_SANITIZE=address;undefined" -DBASALT_CHECK_FORMAT=OFF

      - name: Build
        run: cmake --build build -- -k 0

      - name: Test
        run: ctest --test-dir build --output-on-failure -LE "gpu|format"

  # clang-tidy runs as part of the compile of Basalt's own targets; any finding fails the build (.clang-tidy).
  clang-tidy:
    name: ubuntu-24.04 / clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslc libvulkan1 clang clang-tidy \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-tidy-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DBASALT_CLANG_TIDY=ON

      - name: Build
        run: cmake --build build -- -k 0

  # Source-based coverage of the headless tests. Informational only: the summary is shown on the run
  # page and the HTML report is uploaded as an artifact.
  coverage:
    name: ubuntu-24.04 / coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslc libvulkan1 clang llvm \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build-coverage/_deps
          key: deps-coverage-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Coverage
        run: scripts/coverage.sh

      - name: Summary
        if: always()
        run: |
          {
            echo '## Code coverage (headless tests)'
            echo '```'
            cat build-coverage/coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build-coverage/coverage/html

  # Renders the feature scene on Mesa's lavapipe (a conformant CPU Vulkan 1.3 driver) with the Khronos
  # validation layer: the GPU tests run offscreen, so no display server is needed.
  gpu-lavapipe:
    name: ubuntu-24.04 / GPU tests (lavapipe)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslc libvulkan1 mesa-vulkan-drivers vulkan-validationlayers vulkan-tools \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols

      # Load only lavapipe, so the run never depends on what else the runner image installs. The manifest's
      # file name differs between Mesa packages, so find it instead of hard-coding it.
      - name: Select lavapipe
        run: |
          ls /usr/share/vulkan/icd.d/
          manifest=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)
          test -n "$manifest"
          echo "VK_DRIVER_FILES=$manifest" >> "$GITHUB_ENV"

      # Diagnostic only (vulkaninfo also probes window-system support, which a runner lacks); the GPU
      # tests log every device and fail clearly when none is usable.
      - name: Vulkan device
        run: vulkaninfo --summary || true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-plain-${{ runner.os }}-Release-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBASALT_GPU_TESTS=ON -DBASALT_GOLDEN_DRIVER=lavapipe -DBASALT_CHECK_FORMAT=OFF

      - name: Build
        run: cmake --build build -- -k 0

      - name: GPU tests
        run: ctest --test-dir build --output-on-failure -L gpu

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lavapipe-screenshots
          path: build/Tests/Golden/*.png
          if-no-files-found: warn

  # Short libFuzzer run of every target on each push (scripts/fuzz.sh); longer runs happen nightly
  # (fuzz-nightly.yml). Crash inputs are uploaded so they can be reproduced locally.
  fuzz:
    name: ubuntu-24.04 / fuzz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslc libvulkan1 clang \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build-fuzz/_deps
          key: deps-fuzz-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Fuzz (60 s per target)
        run: scripts/fuzz.sh 60

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: build-fuzz/crashes
