name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# A newer push to the same branch makes older runs pointless: cancel them instead of queueing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every build that compiles C++, including those in scripts/coverage.sh and scripts/fuzz.sh, compiles through ccache
# (build-and-test uses sccache on Windows; the clang-tidy jobs compile only shaders and clear the launchers) and takes the
# dependency sources from a cache shared by every job on an OS, and by the other workflows through main's entries (scripts/ci-fetch-deps.sh, cmake/DependencySources.cmake). A cache miss fetches them
# into the same directory first, so cache hits and misses compile the same paths. The action sets ccache's
# compiler_check to content only on macOS and Windows.
env:
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_COMPILERCHECK: content
  BASALT_DEPS_SOURCE_DIR: ${{ github.workspace }}/_deps

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-latest, macos-15 ]
        config: [ Debug, Release ]
        exclude:
          # The lavapipe job builds the same Release configuration and runs these tests too.
          - os: ubuntu-24.04
            config: Release
        include:
          - os: windows-latest
            launcher: sccache
    env:
      CMAKE_C_COMPILER_LAUNCHER: ${{ matrix.launcher || 'ccache' }}
      CMAKE_CXX_COMPILER_LAUNCHER: ${{ matrix.launcher || 'ccache' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        timeout-minutes: 20
        if: runner.os == 'Linux'
        run: |
          scripts/ci-apt-install.sh ninja-build glslc libvulkan1 libdbus-1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Install dependencies (macOS)
        timeout-minutes: 10
        if: runner.os == 'macOS'
        run: brew install ninja shaderc clang-format

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true
          stripdown: true

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Restore dependency sources
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: _deps
          key: deps-src-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'scripts/ci-fetch-deps.sh') }}

      # Each compiler cache is capped at about twice one build (300M for Release, 1G for Windows Debug, 600M otherwise;
      # about 5.7 GB over all jobs, of the repository's 10 GB Actions cache). Saving prunes only files unused for a week
      # (ccache), so a failed or cancelled job never saves a smaller cache than the one it restored.
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.os }}-${{ matrix.config }}
          variant: ${{ matrix.launcher || 'ccache' }}
          max-size: ${{ matrix.config == 'Release' && '300M' || matrix.launcher && '1G' || '600M' }}
          evict-old-files: 7d

      - name: Fetch dependency sources
        if: steps.deps.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/ci-fetch-deps.sh _deps

      # Saved right away (actions/cache saves only after a successful job), so a later failing step does not leave the
      # next runs fetching again.
      - name: Save dependency sources
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _deps
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Configure
        shell: bash
        run: |
          formatCheck=OFF
          profile=OFF
          if [[ "${{ runner.os }}" == "Linux" && "${{ matrix.config }}" == "Debug" ]]; then profile=ON; fi
          if [[ "${{ runner.os }}" == "macOS" && "${{ matrix.config }}" == "Debug" ]]; then formatCheck=ON; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DBASALT_CHECK_FORMAT=$formatCheck -DBASALT_PROFILE=$profile -DBASALT_BENCHMARK_TESTS=${{ matrix.config == 'Release' && 'ON' || 'OFF' }}

      # cmake/Dependencies.cmake embeds MSVC debug information (/Z7) in Debug objects when a launcher is set. A dependency
      # that adds /Zi itself would make its objects uncacheable again, and one that drops /Z7 would lose debug information.
      - name: Check that every object is cacheable (Windows)
        if: runner.os == 'Windows'
        shell: python
        env:
          CONFIG: ${{ matrix.config }}
        run: |
          import json, os, re, sys
          commands = json.load(open("build/compile_commands.json"))
          shared = [e["file"] for e in commands if re.search(r"[-/]Z[iI](\s|$)", e["command"])]
          if shared:
              print("::error::%d sources compile with /Zi or /ZI, which sccache cannot cache, e.g.:" % len(shared))
              print("\n".join(shared[:20]))
              sys.exit(1)
          if os.environ["CONFIG"] == "Debug":
              plain = [e["file"] for e in commands if not re.search(r"[-/]Z7(\s|$)", e["command"])]
              if plain:
                  print("::error::%d Debug sources compile without /Z7 (no debug information), e.g.:" % len(plain))
                  print("\n".join(plain[:20]))
                  sys.exit(1)

      - name: Check that the build uses the caches
        shell: bash
        run: scripts/ci-check-caches.sh build

      - name: Build
        run: cmake --build build -- -k 0

      # One test per core (NUMBER_OF_PROCESSORS on Windows); in Release, Benchmark_cpu runs alone (RUN_SERIAL).
      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure --no-tests=error -j "${NUMBER_OF_PROCESSORS:-$(getconf _NPROCESSORS_ONLN)}"

      - name: Upload benchmark report
        if: always() && matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ runner.os }}-Release
          path: build/Tests/Benchmark-*.json
          if-no-files-found: warn

  # AddressSanitizer + UndefinedBehaviorSanitizer over every headless test. All code, third-party
  # included, is instrumented (cmake/Sanitizers.cmake).
  sanitizers:
    name: ubuntu-24.04 / ASan+UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          scripts/ci-apt-install.sh ninja-build glslc libvulkan1 clang libdbus-1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Restore dependency sources
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: _deps
          key: deps-src-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'scripts/ci-fetch-deps.sh') }}

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: asan
          max-size: 800M
          evict-old-files: 7d

      - name: Fetch dependency sources
        if: steps.deps.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/ci-fetch-deps.sh _deps

      # Saved right away (actions/cache saves only after a successful job), so a later failing step does not leave the
      # next runs fetching again.
      - name: Save dependency sources
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _deps
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            "-DBASALT_SANITIZE=address;undefined" -DBASALT_CHECK_FORMAT=OFF

      - name: Check that the build uses the caches
        shell: bash
        run: scripts/ci-check-caches.sh build

      - name: Build
        run: cmake --build build -- -k 0

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error -LE "gpu|format" -j "$(nproc)"

  # clang-tidy over the sources of every Basalt target (engine, apps, tests, GPU tests, benchmark and fuzz targets;
  # third-party code never), split over the matrix's jobs by scripts/clang_tidy.py. Any finding fails the job
  # (WarningsAsErrors in .clang-tidy; the script also fails findings that are not errors). The shard comes from the job's
  # index, so every file is checked by exactly one job whatever the matrix holds; matrix.shard only sets the job count.
  clang-tidy:
    name: ubuntu-24.04 / clang-tidy (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3 ]
    env:
      CMAKE_C_COMPILER_LAUNCHER: ""
      CMAKE_CXX_COMPILER_LAUNCHER: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          scripts/ci-apt-install.sh ninja-build glslc libvulkan1 clang clang-tidy libdbus-1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Restore dependency sources
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: _deps
          key: deps-src-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'scripts/ci-fetch-deps.sh') }}

      - name: Fetch dependency sources
        if: steps.deps.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/ci-fetch-deps.sh _deps

      # Saved right away (actions/cache saves only after a successful job), so a later failing step does not leave the
      # next runs fetching again.
      - name: Save dependency sources
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _deps
          key: ${{ steps.deps.outputs.cache-primary-key }}

      # Clang's compile commands (clang-tidy does not know GCC-only flags). The GPU tests and fuzz targets add their
      # sources.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DBASALT_GPU_TESTS=ON -DBASALT_FUZZ=ON \
            -DBASALT_CHECK_FORMAT=OFF

      - name: Check that the build uses the caches
        shell: bash
        run: scripts/ci-check-caches.sh build

      # The only generated files Basalt's sources include: the SPIR-V blobs of the generated EmbeddedShaders.cpp. A
      # source that includes another build-time header fails with a missing include until its target is built here too.
      - name: Compile shaders
        run: cmake --build build --target BasaltShaders

      # Only this tree has every kind of target (fuzz targets included), so its selection is checked against every
      # compiled Basalt source here (no build needed).
      - name: Check the clang-tidy selection
        run: ctest --test-dir build --output-on-failure --no-tests=error -R "^ClangTidyScript$"

      - name: clang-tidy
        run: scripts/clang_tidy.py -p build --shard $(( ${{ strategy.job-index }} + 1 ))/${{ strategy.job-total }} -j "$(nproc)"

  # Source-based coverage of the headless tests. Informational only: the summary is shown on the run
  # page and the HTML report is uploaded as an artifact.
  coverage:
    name: ubuntu-24.04 / coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          scripts/ci-apt-install.sh ninja-build glslc libvulkan1 clang llvm libdbus-1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Restore dependency sources
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: _deps
          key: deps-src-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'scripts/ci-fetch-deps.sh') }}

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: coverage
          max-size: 400M
          evict-old-files: 7d

      - name: Fetch dependency sources
        if: steps.deps.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/ci-fetch-deps.sh _deps

      # Saved right away (actions/cache saves only after a successful job), so a later failing step does not leave the
      # next runs fetching again.
      - name: Save dependency sources
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _deps
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Coverage
        run: scripts/coverage.sh

      - name: Check that the build uses the caches
        shell: bash
        run: scripts/ci-check-caches.sh build-coverage

      - name: Summary
        if: always()
        run: |
          {
            echo '## Code coverage (headless tests)'
            echo '```'
            cat build-coverage/coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build-coverage/coverage/html

  # The Linux Release build: every headless test, then the feature scene rendered on Mesa's lavapipe (a conformant CPU
  # Vulkan 1.3 driver) with the Khronos validation layer. Render tests run offscreen; the editor integration uses Xvfb.
  # lavapipe renders on the CPU, and the GPU tests already fill a runner's cores (without the benchmark, 634 s one at a
  # time and at best 486 s side by side), so two jobs split them. Part 1 runs the Python-driven renders (LocalShadowRender,
  # FSR1Render and StatisticsOverlay start the runtime several times; EditorViewport drives one long editor session;
  # UIFollowupsRender is short), TemporalAAGPU, the GPU benchmark and the headless tests; part 2 every other GPU test, new
  # ones included. Both select with GPU_PART_1.
  gpu-lavapipe:
    name: ubuntu-24.04 / Release + GPU (lavapipe ${{ matrix.part }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: 1
            select: -R
          - part: 2
            select: -E
    env:
      GPU_PART_1: '^(LocalShadowRender|EditorViewport|FSR1Render|StatisticsOverlay|UIFollowupsRender|TemporalAAGPU|Benchmark_gpu)$'
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          scripts/ci-apt-install.sh ninja-build glslc libvulkan1 mesa-vulkan-drivers vulkan-validationlayers vulkan-tools xvfb xauth libdbus-1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev wayland-protocols

      # Load only lavapipe, so the run never depends on what else the runner image installs. The manifest's
      # file name differs between Mesa packages, so find it instead of hard-coding it.
      - name: Select lavapipe
        run: |
          ls /usr/share/vulkan/icd.d/
          manifest=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)
          test -n "$manifest"
          echo "VK_DRIVER_FILES=$manifest" >> "$GITHUB_ENV"

      # Diagnostic only (vulkaninfo also probes window-system support, which a runner lacks); the GPU
      # tests log every device and fail clearly when none is usable.
      - name: Vulkan device
        run: vulkaninfo --summary || true

      - name: Restore dependency sources
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: _deps
          key: deps-src-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'scripts/ci-fetch-deps.sh') }}

      # Both parts build the same tree; part 1 saves the cache for both.
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: lavapipe
          max-size: 300M
          evict-old-files: 7d
          save: ${{ matrix.part == 1 }}

      - name: Fetch dependency sources
        if: steps.deps.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/ci-fetch-deps.sh _deps

      # Saved right away (actions/cache saves only after a successful job), so a later failing step does not leave the
      # next runs fetching again.
      - name: Save dependency sources
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _deps
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBASALT_GPU_TESTS=ON -DBASALT_GOLDEN_DRIVER=lavapipe -DBASALT_CHECK_FORMAT=OFF -DBASALT_BENCHMARK_TESTS=ON

      - name: Check that the build uses the caches
        shell: bash
        run: scripts/ci-check-caches.sh build

      - name: Build
        id: build
        run: cmake --build build -- -k 0

      # The GPU regressions, plus headless tests showing that this job also covers ubuntu-24.04 / Release (excluded from
      # the build-and-test matrix).
      # Every name in GPU_PART_1 too, with the gpu label: a renamed one would quietly move its test into part 2, and one
      # without the label would leave both parts.
      - name: Verify the expected tests are registered
        run: |
          ctest --test-dir build -N --show-only=json-v1 > /tmp/basalt-tests.json
          python3 -c '
          import json, os, sys
          labels = {test["name"]: next((p["value"] for p in test.get("properties", []) if p["name"] == "LABELS"), []) for test in json.load(open("/tmp/basalt-tests.json"))["tests"]}
          part1 = set(os.environ["GPU_PART_1"].strip("^()$").split("|"))
          missing = ({"ViewportGPU", "PostProcessGPU", "PreviewRendererGPU", "BasaltTests", "BasaltTests_Core", "BasaltTestShards", "Benchmark_cpu", "PhysicsDeterminism", "FeatureTest"} | part1) - labels.keys()
          missing and sys.exit(f"Missing tests: {missing}")
          unlabelled = {name for name in part1 if "gpu" not in labels[name]}
          unlabelled and sys.exit(f"GPU_PART_1 tests without the gpu label: {unlabelled}")
          '

      # Each test step runs whenever the build succeeded (the headless one in part 1 only), so a headless failure never
      # hides the GPU results.
      - name: Test
        if: ${{ matrix.part == 1 && !cancelled() && steps.build.outcome == 'success' }}
        run: ctest --test-dir build --output-on-failure --no-tests=error -LE "gpu|format" -j "$(nproc)"

      # Two at a time with two lavapipe threads each (lavapipe otherwise starts one per core in every test). More at once
      # shortened the whole set by at most 13% (559 -> 486 s) but stretched the long Python-driven tests (LocalShadowRender
      # 102 s alone, 138 s at -j2, about 320 s at -j4), and the longest test bounds each part; they start first (COST in
      # Tests/CMakeLists.txt). Benchmark_gpu runs alone with every core (RUN_SERIAL, LP_NUM_THREADS unset).
      - name: GPU tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          LP_NUM_THREADS: 2
        run: ctest --test-dir build --output-on-failure --no-tests=error -L gpu ${{ matrix.select }} "$GPU_PART_1" -j 2

      - name: Upload benchmark report
        if: always() && matrix.part == 1
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-Linux-Release
          path: build/Tests/Benchmark-*.json
          if-no-files-found: warn

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lavapipe-screenshots-${{ matrix.part }}
          path: |
            build/Tests/Benchmark-*
            build/Tests/Golden/**/*.png
            build/Tests/Viewport/*
            build/Tests/StatisticsOverlay/*
            build/Tests/PostProcess/*.png
            build/Tests/Previews/*.png
          if-no-files-found: warn

  # Short libFuzzer run of every target on each push (scripts/fuzz.sh), one target per core at a time; longer runs happen
  # nightly (fuzz-nightly.yml). Crash inputs are uploaded so they can be reproduced locally.
  fuzz:
    name: ubuntu-24.04 / fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          scripts/ci-apt-install.sh ninja-build glslc libvulkan1 clang libdbus-1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Restore dependency sources
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: _deps
          key: deps-src-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'scripts/ci-fetch-deps.sh') }}

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: fuzz
          max-size: 800M
          evict-old-files: 7d

      - name: Fetch dependency sources
        if: steps.deps.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/ci-fetch-deps.sh _deps

      # Saved right away (actions/cache saves only after a successful job), so a later failing step does not leave the
      # next runs fetching again.
      - name: Save dependency sources
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _deps
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Fuzz (60 s per target)
        run: FUZZ_JOBS="$(nproc)" scripts/fuzz.sh 60

      - name: Check that the build uses the caches
        shell: bash
        run: scripts/ci-check-caches.sh build-fuzz

      - name: Upload crash inputs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            build-fuzz/crashes
            build-fuzz/logs
