name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# A newer push to the same branch makes older runs pointless: cancel them instead of queueing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every build, including those in scripts/coverage.sh and scripts/fuzz.sh, compiles through ccache (build-and-test uses
# sccache on Windows) and takes the dependency sources from a cache shared by every job on an OS, and by the other
# workflows through main's entries (scripts/ci-fetch-deps.sh, cmake/DependencySources.cmake). A cache miss fetches them
# into the same directory first, so cache hits and misses compile the same paths. The action sets ccache's
# compiler_check to content only on macOS and Windows.
env:
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_COMPILERCHECK: content
  BASALT_DEPS_SOURCE_DIR: ${{ github.workspace }}/_deps

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-latest, macos-15 ]
        config: [ Debug, Release ]
        exclude:
          # The lavapipe job builds the same Release configuration and runs these tests too.
          - os: ubuntu-24.04
            config: Release
        include:
          - os: windows-latest
            launcher: sccache
    env:
      CMAKE_C_COMPILER_LAUNCHER: ${{ matrix.launcher || 'ccache' }}
      CMAKE_CXX_COMPILER_LAUNCHER: ${{ matrix.launcher || 'ccache' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        timeout-minutes: 20
        if: runner.os == 'Linux'
        run: |
          scripts/ci-apt-install.sh ninja-build glslc libvulkan1 libdbus-1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Install dependencies (macOS)
        timeout-minutes: 10
        if: runner.os == 'macOS'
        run: brew install ninja shaderc clang-format

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true
          stripdown: true

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Restore dependency sources
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: _deps
          key: deps-src-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'scripts/ci-fetch-deps.sh') }}

      # Each compiler cache is capped at about twice one build (300M for Release, 1G for Windows Debug, 600M otherwise;
      # about 5.7 GB over all jobs, of the repository's 10 GB Actions cache). Saving prunes only files unused for a week
      # (ccache), so a failed or cancelled job never saves a smaller cache than the one it restored.
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.os }}-${{ matrix.config }}
          variant: ${{ matrix.launcher || 'ccache' }}
          max-size: ${{ matrix.config == 'Release' && '300M' || matrix.launcher && '1G' || '600M' }}
          evict-old-files: 7d

      - name: Fetch dependency sources
        if: steps.deps.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/ci-fetch-deps.sh _deps

      # Saved right away (actions/cache saves only after a successful job), so a later failing step does not leave the
      # next runs fetching again.
      - name: Save dependency sources
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _deps
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Configure
        shell: bash
        run: |
          formatCheck=OFF
          profile=OFF
          if [[ "${{ runner.os }}" == "Linux" && "${{ matrix.config }}" == "Debug" ]]; then profile=ON; fi
          if [[ "${{ runner.os }}" == "macOS" && "${{ matrix.config }}" == "Debug" ]]; then formatCheck=ON; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DBASALT_CHECK_FORMAT=$formatCheck -DBASALT_PROFILE=$profile -DBASALT_BENCHMARK_TESTS=${{ matrix.config == 'Release' && 'ON' || 'OFF' }}

      # cmake/Dependencies.cmake embeds MSVC debug information (/Z7) in Debug objects when a launcher is set. A dependency
      # that adds /Zi itself would make its objects uncacheable again, and one that drops /Z7 would lose debug information.
      - name: Check that every object is cacheable (Windows)
        if: runner.os == 'Windows'
        shell: python
        env:
          CONFIG: ${{ matrix.config }}
        run: |
          import json, os, re, sys
          commands = json.load(open("build/compile_commands.json"))
          shared = [e["file"] for e in commands if re.search(r"[-/]Z[iI](\s|$)", e["command"])]
          if shared:
              print("::error::%d sources compile with /Zi or /ZI, which sccache cannot cache, e.g.:" % len(shared))
              print("\n".join(shared[:20]))
              sys.exit(1)
          if os.environ["CONFIG"] == "Debug":
              plain = [e["file"] for e in commands if not re.search(r"[-/]Z7(\s|$)", e["command"])]
              if plain:
                  print("::error::%d Debug sources compile without /Z7 (no debug information), e.g.:" % len(plain))
                  print("\n".join(plain[:20]))
                  sys.exit(1)

      - name: Check that the build uses the caches
        shell: bash
        run: scripts/ci-check-caches.sh build

      - name: Build
        run: cmake --build build -- -k 0

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload benchmark report
        if: always() && matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ runner.os }}-Release
          path: build/Tests/Benchmark-*.json
          if-no-files-found: warn

  # AddressSanitizer + UndefinedBehaviorSanitizer over every headless test. All code, third-party
  # included, is instrumented (cmake/Sanitizers.cmake).
  sanitizers:
    name: ubuntu-24.04 / ASan+UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          scripts/ci-apt-install.sh ninja-build glslc libvulkan1 clang libdbus-1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Restore dependency sources
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: _deps
          key: deps-src-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'scripts/ci-fetch-deps.sh') }}

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: asan
          max-size: 800M
          evict-old-files: 7d

      - name: Fetch dependency sources
        if: steps.deps.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/ci-fetch-deps.sh _deps

      # Saved right away (actions/cache saves only after a successful job), so a later failing step does not leave the
      # next runs fetching again.
      - name: Save dependency sources
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _deps
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            "-DBASALT_SANITIZE=address;undefined" -DBASALT_CHECK_FORMAT=OFF

      - name: Check that the build uses the caches
        shell: bash
        run: scripts/ci-check-caches.sh build

      - name: Build
        run: cmake --build build -- -k 0

      - name: Test
        run: ctest --test-dir build --output-on-failure -LE "gpu|format"

  # clang-tidy runs as part of the compile of Basalt's own targets; any finding fails the build (.clang-tidy).
  clang-tidy:
    name: ubuntu-24.04 / clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          scripts/ci-apt-install.sh ninja-build glslc libvulkan1 clang clang-tidy libdbus-1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Restore dependency sources
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: _deps
          key: deps-src-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'scripts/ci-fetch-deps.sh') }}

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: clang-tidy
          max-size: 600M
          evict-old-files: 7d

      - name: Fetch dependency sources
        if: steps.deps.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/ci-fetch-deps.sh _deps

      # Saved right away (actions/cache saves only after a successful job), so a later failing step does not leave the
      # next runs fetching again.
      - name: Save dependency sources
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _deps
          key: ${{ steps.deps.outputs.cache-primary-key }}

      # clang-tidy itself is never cached; only the compile that follows it is.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DBASALT_CLANG_TIDY=ON

      - name: Check that the build uses the caches
        shell: bash
        run: scripts/ci-check-caches.sh build

      - name: Build
        run: cmake --build build -- -k 0

  # Source-based coverage of the headless tests. Informational only: the summary is shown on the run
  # page and the HTML report is uploaded as an artifact.
  coverage:
    name: ubuntu-24.04 / coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          scripts/ci-apt-install.sh ninja-build glslc libvulkan1 clang llvm libdbus-1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Restore dependency sources
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: _deps
          key: deps-src-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'scripts/ci-fetch-deps.sh') }}

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: coverage
          max-size: 400M
          evict-old-files: 7d

      - name: Fetch dependency sources
        if: steps.deps.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/ci-fetch-deps.sh _deps

      # Saved right away (actions/cache saves only after a successful job), so a later failing step does not leave the
      # next runs fetching again.
      - name: Save dependency sources
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _deps
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Coverage
        run: scripts/coverage.sh

      - name: Check that the build uses the caches
        shell: bash
        run: scripts/ci-check-caches.sh build-coverage

      - name: Summary
        if: always()
        run: |
          {
            echo '## Code coverage (headless tests)'
            echo '```'
            cat build-coverage/coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build-coverage/coverage/html

  # The Linux Release build: every headless test, then the feature scene rendered on Mesa's lavapipe (a conformant CPU
  # Vulkan 1.3 driver) with the Khronos validation layer. Render tests run offscreen; the editor integration uses Xvfb.
  gpu-lavapipe:
    name: ubuntu-24.04 / Release + GPU (lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          scripts/ci-apt-install.sh ninja-build glslc libvulkan1 mesa-vulkan-drivers vulkan-validationlayers vulkan-tools xvfb xauth libdbus-1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev wayland-protocols

      # Load only lavapipe, so the run never depends on what else the runner image installs. The manifest's
      # file name differs between Mesa packages, so find it instead of hard-coding it.
      - name: Select lavapipe
        run: |
          ls /usr/share/vulkan/icd.d/
          manifest=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)
          test -n "$manifest"
          echo "VK_DRIVER_FILES=$manifest" >> "$GITHUB_ENV"

      # Diagnostic only (vulkaninfo also probes window-system support, which a runner lacks); the GPU
      # tests log every device and fail clearly when none is usable.
      - name: Vulkan device
        run: vulkaninfo --summary || true

      - name: Restore dependency sources
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: _deps
          key: deps-src-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'scripts/ci-fetch-deps.sh') }}

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: lavapipe
          max-size: 300M
          evict-old-files: 7d

      - name: Fetch dependency sources
        if: steps.deps.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/ci-fetch-deps.sh _deps

      # Saved right away (actions/cache saves only after a successful job), so a later failing step does not leave the
      # next runs fetching again.
      - name: Save dependency sources
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _deps
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBASALT_GPU_TESTS=ON -DBASALT_GOLDEN_DRIVER=lavapipe -DBASALT_CHECK_FORMAT=OFF -DBASALT_BENCHMARK_TESTS=ON

      - name: Check that the build uses the caches
        shell: bash
        run: scripts/ci-check-caches.sh build

      - name: Build
        id: build
        run: cmake --build build -- -k 0

      # The GPU regressions, plus headless tests showing that this job also covers ubuntu-24.04 / Release (excluded from
      # the build-and-test matrix).
      - name: Verify the expected tests are registered
        run: |
          ctest --test-dir build -N --show-only=json-v1 > /tmp/basalt-tests.json
          python3 -c 'import json; tests = json.load(open("/tmp/basalt-tests.json"))["tests"]; names = {t["name"] for t in tests}; missing = {"EditorViewport", "ViewportGPU", "PostProcessGPU", "TemporalAAGPU", "PreviewRendererGPU", "Benchmark_gpu", "BasaltTests", "Benchmark_cpu", "PhysicsDeterminism", "FeatureTest"} - names; missing and exit(f"Missing tests: {missing}")'

      # Each test step runs whenever the build succeeded, so a headless failure never hides the GPU results.
      - name: Test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ctest --test-dir build --output-on-failure --no-tests=error -LE "gpu|format"

      - name: GPU tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ctest --test-dir build --output-on-failure --no-tests=error -L gpu

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-Linux-Release
          path: build/Tests/Benchmark-*.json
          if-no-files-found: warn

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lavapipe-screenshots
          path: |
            build/Tests/Benchmark-*
            build/Tests/Golden/**/*.png
            build/Tests/Viewport/*
            build/Tests/StatisticsOverlay/*
            build/Tests/PostProcess/*.png
            build/Tests/Previews/*.png
          if-no-files-found: warn

  # Short libFuzzer run of every target on each push (scripts/fuzz.sh); longer runs happen nightly
  # (fuzz-nightly.yml). Crash inputs are uploaded so they can be reproduced locally.
  fuzz:
    name: ubuntu-24.04 / fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          scripts/ci-apt-install.sh ninja-build glslc libvulkan1 clang libdbus-1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Restore dependency sources
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: _deps
          key: deps-src-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'scripts/ci-fetch-deps.sh') }}

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: fuzz
          max-size: 800M
          evict-old-files: 7d

      - name: Fetch dependency sources
        if: steps.deps.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/ci-fetch-deps.sh _deps

      # Saved right away (actions/cache saves only after a successful job), so a later failing step does not leave the
      # next runs fetching again.
      - name: Save dependency sources
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _deps
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Fuzz (60 s per target)
        run: scripts/fuzz.sh 60

      - name: Check that the build uses the caches
        shell: bash
        run: scripts/ci-check-caches.sh build-fuzz

      - name: Upload crash inputs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            build-fuzz/crashes
            build-fuzz/logs
